name: Build Android APK (v1.5.5-test)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build OceanTriRecomp Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Android SDK & NDK 28
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-35"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Build Translator CLI
        run: |
          dotnet build toolchain/translator/src/Translator.Cli/Translator.Cli.csproj -c Release

      - name: Build libSDL3.so from source (NDK r28, 4KB page, Android 10+)
        run: |
          mkdir -p packaging/android/libs/arm64-v8a
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git $RUNNER_TEMP/SDL3-src
          cmake -S $RUNNER_TEMP/SDL3-src -B $RUNNER_TEMP/SDL3-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/28.2.13676358/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=4096"
          cmake --build $RUNNER_TEMP/SDL3-build --target SDL3-shared --parallel $(nproc)
          cp $RUNNER_TEMP/SDL3-build/libSDL3.so packaging/android/libs/arm64-v8a/libSDL3.so

      - name: Build OpenSSL for Android ARM64
        run: |
          git clone --depth 1 -b openssl-3.0.15 https://github.com/openssl/openssl.git $RUNNER_TEMP/openssl-src
          cd $RUNNER_TEMP/openssl-src
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358
          export PATH=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH
          ./Configure android-arm64 -D__ANDROID_API__=29 no-shared no-tests --prefix=$RUNNER_TEMP/openssl-android
          make -j$(nproc)
          make install_sw
          if [ -d "$RUNNER_TEMP/openssl-android/lib64" ] && [ ! -d "$RUNNER_TEMP/openssl-android/lib" ]; then
            ln -s lib64 "$RUNNER_TEMP/openssl-android/lib"
          fi
          echo "OPENSSL_ANDROID_DIR=$RUNNER_TEMP/openssl-android" >> $GITHUB_ENV

      - name: Compile Native Libraries and Package APK
        run: |
          chmod +x scripts/build-android.sh packaging/android/build_apk.sh
          bash scripts/build-android.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OceanTriRecomp-Android-v1.5.5-test-arm64
          path: release/OceanTriRecomp-Android-v1.5.5-test-arm64.apk
          if-no-files-found: error

      - name: Publish Pre-Release on GitHub
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.5-test
          name: "OceanTriRecomp Android v1.5.5 Test (Telemetry Logger)"
          body: |
            ## OceanTriRecomp Android v1.5.5-test 🦖📱

            Esta versión de prueba incluye telemetría integrada para diagnosticar el fallo de físicas y teletransporte en el Bosque Inundado y el atajo del campamento en *"Sin amor por el ludroth"*.

            ### 📝 Registros generados
            - Ubicación del log en el dispositivo: `/storage/emulated/0/MH3/logs/hunter_telemetry.log`
            - Registro automático de anomalías `[TELEPORT DETECTED]` y `[WALKING ON WATER]`.
          files: release/OceanTriRecomp-Android-v1.5.5-test-arm64.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
